      background: rgba(10, 10, 22, 0.6);

      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
      gap: 0.9rem;

      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      border-radius: 8px;
      border: 1px solid rgba(196, 90, 166, 0.35);

    .app-shot img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      border: 1px solid rgba(196, 90, 166, 0.4);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .app-shot figcaption { font-size: 0.85rem; color: #c9c3da; margin-top: 0.5rem; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }
    main { max-width: 52rem; }
  </style>
